server:
  port: 8080

spring:
  application:
    name: mrtd-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ocr:
  sidecar:
    extract-url: http://localhost:8001/ocr/extract
    health-url: http://localhost:8001/health
    timeout: 2s

api:
  auth:
    enabled: true
    header-name: X-API-Key
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
    keys:
      - id: local-dev
        value: dev-api-key
        tier: default
      - id: benchmark
        value: benchmark-api-key
        tier: benchmark
  rate-limit:
    enabled: true
    tiers:
      default:
        capacity: 100
        refill-tokens: 100
        refill-period: 1m
      premium:
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1m
      benchmark:
        capacity: 10000
        refill-tokens: 10000
        refill-period: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,ocrSidecar
        liveness:
          include: livenessState
